name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test,tui]
    
    - name: Run tests
      run: |
        pytest tests/ --cov=src/dockerpilot --cov-report=xml
    
    - name: Compile sources
      run: |
        python -m compileall -q src tests

  dozeyguard:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Check formatting
      working-directory: components/dozeyguard
      run: cargo fmt --check

    - name: Run Clippy
      working-directory: components/dozeyguard
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run DozeyGuard tests
      working-directory: components/dozeyguard
      run: cargo test --all-targets

  windows-smoke:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test,tui]

    - name: Run smoke tests
      run: |
        pytest tests/test_cli_parser.py tests/test_cli_tui.py tests/test_tui_runtime.py tests/test_main.py tests/test_build_fallback.py tests/test_cli_handlers.py

  extras-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test,tui]
        pip install -r DockerPilotExtras/requirements.txt

    - name: Run full suite with Extras dependencies
      run: |
        pytest tests/

  extras-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DockerPilotExtras/frontend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: DockerPilotExtras/frontend/package-lock.json
    - run: npm ci
    - run: npm test
    - run: npm run build

  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install packaging tools
      run: |
        python -m pip install --upgrade pip
        pip install build
    
    - name: Build package
      run: |
        python -m build
