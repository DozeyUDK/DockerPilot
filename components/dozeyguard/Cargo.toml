[package]
name = "dozeyguard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Static policy enforcer for Docker Compose JSON"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"
